name: Windows verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build UnsortedOrderer.sln -c Release
      - name: Run test suite
        run: dotnet test UnsortedOrderer.Tests -c Release --no-build
      - name: Verify self-contained Windows package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "unsortedorderer-publish"
          # A workflow rerun keeps its number, and builds in the same minute have different versions.
          dotnet publish UnsortedOrderer.WinForms -c Release -r win-x64 -p:PublishProfile=FolderProfile "-p:BuildVersion=$env:GITHUB_RUN_NUMBER" -p:RevisionVersion=0 -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath $output -Force)
          if ($files.Count -ne 1 -or $files[0].Name -notmatch '^UnsortedOrderer_v\d+\.\d+\.\d+\.\d+\.exe$') {
            throw "Expected exactly one versioned standalone executable. Found $($files.Name -join ', ')"
          }
          $filenameVersion = [regex]::Match($files[0].Name, '\d+\.\d+\.\d+\.\d+').Value
          $embeddedVersion = $files[0].VersionInfo.FileVersion
          if ([version]$embeddedVersion -ne [version]$filenameVersion) {
            throw "Embedded version $embeddedVersion differs from filename version $filenameVersion"
          }
          # Read the RT_MANIFEST resource from the published executable, not
          # just app.manifest from the source tree. The final single-file EXE
          # must trigger UAC before the WinForms window is created.
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $mt = Get-ChildItem -Path $sdkRoot -Filter mt.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.DirectoryName -match '[\\/]x64
      - name: Upload Windows x64 build from main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: UnsortedOrderer-win-x64
          path: ${{ runner.temp }}/unsortedorderer-publish/*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: UnsortedOrderer-win-x64
          path: release-package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh release-package
 } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe not found' }
          $extractedManifest = Join-Path $env:RUNNER_TEMP 'published-app.manifest'
          & $mt.FullName "-inputresource:$($files[0].FullName);#1" "-out:$extractedManifest"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $extractedManifest)) {
            throw 'Cannot extract RT_MANIFEST from published executable'
          }
          [xml]$manifest = Get-Content -Raw -LiteralPath $extractedManifest
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace('asmv3', 'urn:schemas-microsoft-com:asm.v3')
          $level = $manifest.SelectSingleNode('//asmv3:requestedExecutionLevel', $ns)
          if (-not $level -or $level.level -ne 'requireAdministrator' -or $level.uiAccess -ne 'false') {
            throw "Published EXE does not request requireAdministrator with uiAccess=false"
          }
      - name: Upload Windows x64 build from main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: UnsortedOrderer-win-x64
          path: ${{ runner.temp }}/unsortedorderer-publish/*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: UnsortedOrderer-win-x64
          path: release-package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh release-package
